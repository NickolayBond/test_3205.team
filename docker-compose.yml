version: '3.8'

services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      target: ${BACKEND_TARGET:-development}
    container_name: test_3205.team
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - STORAGE_TYPE=${STORAGE_TYPE:-memory}
      - MAX_CONCURRENT_REQUESTS=5
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    volumes:
      - /app/node_modules 
    develop:
      watch:
        - action: sync
          path: ./packages/backend
          target: /app
          ignore:
            - node_modules/
    networks:
      - url-checker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  url-checker-network:
    driver: bridge
